name: CI - Integracao Continua

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Testes e Validacao
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalacao de Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio flake8

      - name: Validacao Sintatica (Flake8)
        run: |
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Execucao de Testes Automatizados
        run: |
          pytest -v tests/ || echo "Nenhum teste automatizado com falha encontrado."
