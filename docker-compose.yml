services:
  instagram-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: instagram-ai
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8085}:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./profiles:/app/profiles
      - ./logs:/app/logs
      - ./app:/app/app
    networks:
      - koala-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  koala-network:
    name: koala-network
    driver: bridge
